name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The e2e tests size the window up to 1700 px wide. Whether the runner lets the resolution
      # change isn't documented, so this tries, says what it got, and never fails the run.
      - name: Screen size (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Set-DisplayResolution failed: $_" }
          Get-CimInstance Win32_VideoController | Select-Object Name, CurrentHorizontalResolution, CurrentVerticalResolution | Format-List

      # Ubuntu 24.04 restricts the unprivileged user namespaces Electron's sandbox needs.
      - name: Allow Electron's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install
        run: npm ci

      # Each step below runs even when one before it failed, so every result shows.
      - name: Status check
        if: ${{ !cancelled() }}
        run: npx vitest run src/main/pty/statusPassthrough.pty.test.ts --silent=false

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: E2E tests
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a npm run test:e2e

      - name: E2E tests
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
