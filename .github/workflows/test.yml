name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The newest LTS, with the npm it ships: what a friend installs today.
          node-version: lts/*
          cache: npm

      # The e2e tests size the window up to 1700 px wide. Whether the runner lets the resolution
      # change isn't documented, so this tries, says what it got, and never fails the run.
      - name: Screen size (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Set-DisplayResolution failed: $_" }
          Get-CimInstance Win32_VideoController | Select-Object Name, CurrentHorizontalResolution, CurrentVerticalResolution | Format-List

      - name: Install
        run: npm ci

      # Each step below runs even when one before it failed, so every result shows.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      # The next two steps run `npm start` the way a friend does, on an Ubuntu that blocks Chromium's
      # sandbox. A fresh data folder has no project, so Mainframe waits at its folder dialog: `timeout`
      # ends it after 90 seconds (exit 124) and that is the pass. Any other exit fails the step, such as
      # Chromium's "No usable sandbox" abort.
      - name: Start as a friend does (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: |
          set +e
          export MAINFRAME_DATA_DIR="$(mktemp -d)"
          timeout 90 xvfb-run -a npm start 2>&1 | tee start.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 124 ]; then echo "npm start ended with exit code $code, not still running"; exit 1; fi
          # Nothing set up Electron's setuid helper, so Mainframe must have said it starts without the sandbox.
          grep -q "without Chromium's sandbox" start.log

      - name: Start with the setuid sandbox (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: |
          # The README's way to keep the sandbox.
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          set +e
          export MAINFRAME_DATA_DIR="$(mktemp -d)"
          timeout 90 xvfb-run -a npm start 2>&1 | tee start.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 124 ]; then echo "npm start ended with exit code $code, not still running"; exit 1; fi
          # With the helper set up, Mainframe keeps the sandbox and says nothing.
          ! grep -q "without Chromium's sandbox" start.log

      - name: E2E tests
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        # xvfb-run's own default screen is far smaller than the window Mainframe opens.
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:e2e

      - name: E2E tests
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: npm run test:e2e

      # DIAGNOSTIC (Windows e2e diagnosis), reverted before the last push: the four tests that failed
      # on Windows and the raw reader's guard, eight times each, then the whole suite once.
      - name: E2E repeat (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          npx electron-vite build
          npx playwright test e2e/terminal.e2e.ts:122 e2e/terminal.e2e.ts:141 e2e/manager.e2e.ts:266 e2e/session-panel.e2e.ts:117 e2e/tasks.e2e.ts:155 --repeat-each=8 --reporter=list --output=test-results/repeat

      - name: E2E tests
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: npx playwright test --reporter=list --output=test-results/full

      - name: Print diagnostics
        if: ${{ always() }}
        shell: bash
        run: find test-results -name 'diag-*.txt' -print -exec cat {} \; || true

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
